name: forever

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  classic:
    uses: ./.github/workflows/template.yml
    with:
      BRANCH: forever
      FLAVOR: camelot

  classic-mix-into-source:
    uses: ./.github/workflows/template.yml
    with:
      BRANCH: forever
      FLAVOR: camelot
      TARGET_BRANCH_SUFFIX: '-mix-into-source'
      MIX_ANNOTATIONS_INTO_SOURCE: true
      INCLUDE_RAW_XML_SOURCE: true
